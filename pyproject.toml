[project]
name = "dragon-city-legacy"
version = "0.1.0"
description = "Dragon City Flash Restoration Project - local server for the original Adobe Flash game (2012-2020)"
authors = [
    { name = "Gabriel18017" },
    { name = "Marcuth", email = "me@marcuth.dev" },
]
readme = "README.md"
urls = { Author = "https://github.com/Gabriel18017" }
requires-python = ">=3.9,<4.0"
dependencies = ["flask (>=3.1.3,<4.0.0)", "flask-cors (>=6.0.5,<7.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
dragon-city = "dragon_city.__main__:main"

[tool.poetry]
packages = [{ include = "dragon_city", from = "src" }]
