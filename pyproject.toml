[project]
name = "dragon-city-legacy"
version = "0.2.0"
description = "Dragon City Flash Restoration Project - local server for the original Adobe Flash game (2012-2020)"
authors = [
    { name = "Gabriel18017" },
    { name = "Marcuth", email = "me@marcuth.dev" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
urls = { Author = "https://github.com/Gabriel18017" }
requires-python = ">=3.9,<4.0"
dependencies = ["flask (>=3.1.3,<4.0.0)", "sqlalchemy (>=2.0,<3)", "psycopg[binary] (>=3.2,<4)", "alembic (>=1.13,<2)", "pymongo (>=4.8,<5)", "argon2-cffi (>=23.1)", "email-validator (>=2.1,<3)", "flask-limiter (>=3.8,<4)", "gunicorn (>=22,<24)", "pydantic (>=2.7,<3)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
dragon-city = "src.cli:main"

[tool.poetry]
packages = [{ include = "src" }]

[dependency-groups]
dev = [
    "pytest (>=8)",
    "mongomock (>=4.1)"
]
